services:
  postgres:
    image: postgres:16-alpine
    container_name: payguard-postgres
    environment:
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard
      POSTGRES_DB: payguard
    ports:
      - "5434:5432"
    volumes:
      - payguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard -d payguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payguard-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  payguard_postgres_data:
