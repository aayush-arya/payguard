[project]
name = "payguard"
version = "0.1.0"
description = "Idempotent payment gateway backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    # Exact-pinned, unlike everything else here: `ruff format` is not
    # forward-compatible between versions (a newer release changed how it
    # formats fenced code blocks in Markdown, breaking CI's first run
    # against this exact repo) -- `>=` would let local dev and CI silently
    # resolve to different versions and disagree about what "correctly
    # formatted" means.
    "ruff==0.16.3",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (Depends(...)/Header(...) as a
# parameter default) is the framework's documented API, not the mutable-
# default-argument footgun B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate`; regenerating would
# reproduce the same long lines, so hand-formatting them is pointless.
"packages/database/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
