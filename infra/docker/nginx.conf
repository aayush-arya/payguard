server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # try_files falls back to index.html for any path nginx doesn't have a
    # file for -- required because this is a client-side-routed SPA
    # (react-router's BrowserRouter): a hard refresh on /payments/<id> is a
    # real GET request nginx would otherwise 404, since no such file exists
    # on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
