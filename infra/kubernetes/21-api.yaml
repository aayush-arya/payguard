# Starting at 2 replicas, not 1 -- this is the whole point of Phase 16's
# rate limiter being Redis-backed rather than an in-process counter: a
# single-replica deployment would never have exposed whether the limit was
# actually shared correctly, only whether the code compiled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: payguard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: payguard-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: payguard-config
            - secretRef:
                name: payguard-secrets
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: payguard
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
---
# Scales on CPU alone -- this system's per-request cost is dominated by
# sequential database round trips (docs/load-testing.md's Phase 15 finding),
# not CPU-bound work, so a memory or custom-metric trigger would more
# accurately predict "about to fall behind." CPU-based HPA is still the
# right starting point for a first pass: it needs no extra metrics
# pipeline (like Prometheus Adapter would for a custom metric) to work at
# all, and this Deployment's own /metrics endpoint (Phase 12) is exactly
# what a follow-up custom-metrics HPA would read from.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: payguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
