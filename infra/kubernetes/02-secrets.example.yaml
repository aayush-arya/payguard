# Template, not a real manifest -- named *.example.yaml (mirroring .env.example
# at the repo root) so it's never accidentally applied or mistaken for
# something safe to commit with real values filled in. Copy this to
# 02-secrets.yaml (already .gitignored, same pattern as .env), fill in real
# values, and apply it -- or better, in a real deployment, generate this
# Secret from a proper secret manager (AWS Secrets Manager via the External
# Secrets Operator, Sealed Secrets, or your cloud provider's equivalent)
# rather than `kubectl apply -f` on a file that ever touched a developer's
# disk in plaintext. infra/terraform/ (Phase 18) provisions the AWS-side
# secret store this would eventually read from.
apiVersion: v1
kind: Secret
metadata:
  name: payguard-secrets
  namespace: payguard
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://payguard:CHANGE_ME@postgres:5432/payguard"
  REDIS_URL: "redis://redis:6379/0"
  WEBHOOK_SECRET: "CHANGE_ME_generate_a_real_random_secret"
  POSTGRES_PASSWORD: "CHANGE_ME"
