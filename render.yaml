# Render Blueprint (https://render.com/docs/blueprint-spec) -- deploys the
# whole stack (Phase 17's containers, unchanged) from this one file: New
# Blueprint -> connect this repo -> Render reads this and provisions
# everything below in one go.
#
# Two things Render can't wire up automatically, so they're manual
# one-time steps after the first deploy (see docs/deployment.md):
#   1. payguard-dashboard's VITE_API_BASE_URL below is a *guess* at the URL
#      Render will assign payguard-api (predictable only if that name is
#      still available account-wide). Confirm it matches the real URL in
#      the Render dashboard once payguard-api is live; if not, edit the env
#      var and trigger a manual redeploy of payguard-dashboard -- Vite
#      bakes this in at build time, so a plain env var change alone won't
#      take effect without a rebuild.
#   2. Render's free-tier availability for the Key Value (Redis) service
#      below has changed more than once; if `plan: free` isn't offered when
#      you go through this, either pick the cheapest paid plan or point
#      REDIS_URL at a free external Redis (e.g. Upstash) instead.

databases:
  - name: payguard-db
    plan: free
    databaseName: payguard
    user: payguard

services:
  - type: redis
    name: payguard-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: payguard-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /v1/health
    # Runs the (idempotent) migration and demo-merchant seed before every
    # boot -- see scripts/seed_demo_merchant.py's own docstring, which
    # already anticipated this as "a real deploy's init step". Safe to run
    # on every restart/redeploy, not just the first one.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      python scripts/seed_demo_merchant.py &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payguard-redis
          type: redis
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true

  - type: worker
    name: payguard-worker
    runtime: docker
    dockerfilePath: infra/docker/worker.Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payguard-db
          property: connectionString

  - type: web
    name: payguard-dashboard
    runtime: docker
    dockerfilePath: infra/docker/frontend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    dockerBuildArgs:
      # See the top-of-file note -- verify this against payguard-api's
      # actual assigned URL after the first deploy.
      VITE_API_BASE_URL: https://payguard-api.onrender.com
