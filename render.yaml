# Render Blueprint (https://render.com/docs/blueprint-spec) -- deploys the
# whole stack (Phase 17's containers, unchanged) from this one file: New
# Blueprint -> connect this repo -> Render reads this and provisions
# everything below in one go.
#
# Three things worth knowing about the free-tier shape of this (see
# docs/deployment.md for the full writeup):
#   1. payguard-dashboard's VITE_API_BASE_URL below is a *guess* at the URL
#      Render will assign payguard-api (predictable only if that name is
#      still available account-wide). Confirm it matches the real URL in
#      the Render dashboard once payguard-api is live; if not, edit the env
#      var and trigger a manual redeploy of payguard-dashboard -- Vite
#      bakes this in at build time, so a plain env var change alone won't
#      take effect without a rebuild.
#   2. Render's free-tier availability for the Key Value (Redis) service
#      below has changed more than once; if `plan: free` isn't offered when
#      you go through this, either pick the cheapest paid plan or point
#      REDIS_URL at a free external Redis (e.g. Upstash) instead.
#   3. There's no separate outbox-worker service here on purpose -- Render's
#      free tier has no free background-worker plan. RUN_WORKER_INPROCESS=1
#      below makes payguard-api run apps/worker/main.py's poll loop as a
#      background asyncio task instead (apps/api/main.py's lifespan). Every
#      other deployment target (docker-compose.prod.yml, Kubernetes) still
#      runs it as its own process, which is the architecturally-correct
#      shape apps/worker/main.py's own docstring explains.

databases:
  - name: payguard-db
    plan: free
    databaseName: payguard
    user: payguard

services:
  - type: redis
    name: payguard-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: payguard-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /v1/health
    # Runs the (idempotent) migration and demo-merchant seed before every
    # boot -- see scripts/seed_demo_merchant.py's own docstring, which
    # already anticipated this as "a real deploy's init step". Safe to run
    # on every restart/redeploy, not just the first one.
    dockerCommand: >-
      sh -c "alembic upgrade head &&
      python scripts/seed_demo_merchant.py &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payguard-redis
          type: redis
          property: connectionString
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: RUN_WORKER_INPROCESS
        value: "1"

  - type: web
    name: payguard-dashboard
    runtime: docker
    dockerfilePath: infra/docker/frontend.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Render passes a Docker-runtime service's envVars through as build
      # args too, which is what gets this into the Dockerfile's
      # VITE_API_BASE_URL ARG -- see the top-of-file note: verify this
      # against payguard-api's actual assigned URL after the first deploy.
      - key: VITE_API_BASE_URL
        value: https://payguard-api.onrender.com
